# Coolify terminates public HTTPS; this gateway has no host port mappings.
# Docker DNS resolution keeps upstream addresses fresh after redeployment.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $dograh_connection {
    default upgrade;
    "" close;
}
map $http_x_forwarded_proto $dograh_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

upstream dograh_api {
    zone dograh_api 64k;
    server api:8000 resolve;
}
upstream dograh_ui {
    zone dograh_ui 64k;
    server ui:3010 resolve;
}
upstream dograh_storage {
    zone dograh_storage 64k;
    server minio:9000 resolve;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $dograh_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dograh_connection;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    location = /healthz {
        proxy_pass http://dograh_api/api/v1/health;
    }

    # Bypass the UI for API requests, MCP, SSE, and telephony WebSockets.
    location /api/v1/ {
        proxy_pass http://dograh_api;
        proxy_request_buffering off;
    }

    # Preserve the full URI, query string, and original Host for S3 SigV4.
    # MinIO checks signatures; the bucket has no anonymous access policy.
    location /voice-audio/ {
        proxy_pass http://dograh_storage;
        proxy_request_buffering off;
    }

    # UI routes include /api/auth/* and /api/config/*.
    location / {
        proxy_pass http://dograh_ui;
    }
}

